name: APK

on:
  pull_request:
  workflow_dispatch:

# Only the newest commit on the branch is worth an APK; a superseded build is one
# nobody will install.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The artifact name is what a reviewer reads in the run summary and what the
      # downloaded zip is called, so it carries the branch the APK was built from.
      # github.ref_name would be "34/merge" on a pull request, hence head_ref first.
      # A slash is legal in a branch name and illegal in an artifact name — and is
      # the only character git allows that the artifact does not — so ci/apk-on-pr
      # is uploaded as ci-apk-on-pr.
      - name: Branch the APK was built from
        id: branch
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: echo "name=${BRANCH//\//-}" >> "$GITHUB_OUTPUT"

      # Debug rather than release: a release APK would need a signing key the
      # repository deliberately does not hold, and an unsigned one will not install.
      #
      # local.properties is git-ignored, so BGG_API_TOKEN is empty here and the APK
      # comes out with BGG features reporting themselves unconfigured. sdk.dir is not
      # needed either — the runner already exports ANDROID_HOME.
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-${{ steps.branch.outputs.name }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
